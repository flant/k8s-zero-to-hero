apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-web
  labels:
    app: {{ .Chart.Name }}-web
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-web
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-web
    spec:
      volums:
      - name: nginx-config
        ConfigMap:
          name: {{ .Chart.Name }}-nginx-config
      imagePullSecrets:
      - name: registrysecret
      containers:
      - name: app
        image: {{ .Values.werf.image.app }}
        command: ["/goapp"]
        ports:
        - name: app
          containerPort: {{ .Values.app.containerPort }}
      - name: nginx
        image: {{ .Values.werf.image.nginx }}
        ports:
        - name: http
          containerPort: {{ .Values.nginx.targetPort }}
        volumeMounts:
        - name: nginx-config
          mountPath: etc/nginx/nginx.config
          subPath: nginx.config



